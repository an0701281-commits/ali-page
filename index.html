<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALI</title>

<style>
body {
    margin: 0;
    background: #050505;
    color: #00ff66;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
}

.box {
    border: 2px solid #00ff66;
    padding: 35px;
    width: 80%;
    max-width: 500px;
    box-shadow: 0 0 25px #00ff66;
}

h1 {
    font-size: 55px;
    margin: 0 0 20px;
}

.code {
    text-align: left;
    color: #00cc55;
    line-height: 1.8;
}

.cursor {
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}
</style>
</head>

<body>

<div class="box">
    <h1>ALI</h1>

    <div class="code">
        > SYSTEM ONLINE<br>
        > ACCESS GRANTED<br>
        > INITIALIZING...<br>
        > STATUS: <b>ACTIVE</b><br>
        > 01010101 11001010<br>
        > 10101100 00110101<br>
        > 11100010 01010101<br>
        > <span class="cursor">_</span>
    </div>
</div>

</body>
      </html>
